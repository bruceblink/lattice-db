schema_version = "0.1"

[[cases]]
id = "F-001"
category = "process_crash"
injection_point = "before first frame write"
precondition = "a transaction has been validated but no frame is durable"
input = "process terminates before BEGIN"
expected_outcome = "rejected"
durable_artifacts = "none"
error_code = "E_TRUNCATED_TAIL"
retry_action = "retry the transaction"
cursor_effect = "unchanged"
isolation_scope = "transaction"

[[cases]]
id = "F-002"
category = "process_crash"
injection_point = "after operation frame and before COMMIT"
precondition = "BEGIN and at least one operation frame exist"
input = "process terminates before COMMIT"
expected_outcome = "rejected"
durable_artifacts = "incomplete transaction frames are ignored"
error_code = "E_TRUNCATED_TAIL"
retry_action = "retry the transaction"
cursor_effect = "unchanged"
isolation_scope = "transaction"

[[cases]]
id = "F-003"
category = "process_crash"
injection_point = "after COMMIT and before sync_all"
precondition = "COMMIT exists in the OS buffer"
input = "process terminates before durability confirmation"
expected_outcome = "rejected"
durable_artifacts = "transaction is not visible after recovery"
error_code = "E_TRUNCATED_TAIL"
retry_action = "retry after recovery"
cursor_effect = "unchanged"
isolation_scope = "transaction"

[[cases]]
id = "F-004"
category = "process_crash"
injection_point = "after successful sync_all"
precondition = "COMMIT and transaction data are durable"
input = "process restarts after local commit"
expected_outcome = "accepted"
durable_artifacts = "transaction is replayed exactly once"
error_code = ""
retry_action = "resume synchronization"
cursor_effect = "advances contiguously"
isolation_scope = "transaction"

[[cases]]
id = "F-005"
category = "storage_corruption"
injection_point = "tail of a log segment"
precondition = "last frame is shorter than its declared length"
input = "truncate the final frame"
expected_outcome = "rejected"
durable_artifacts = "valid prefix is retained and incomplete tail is isolated"
error_code = "E_TRUNCATED_TAIL"
retry_action = "repair or restore the segment"
cursor_effect = "unchanged after the valid prefix"
isolation_scope = "log segment"

[[cases]]
id = "F-006"
category = "storage_corruption"
injection_point = "frame length field"
precondition = "declared payload exceeds the configured limit"
input = "replace payload length with an oversized value"
expected_outcome = "rejected"
durable_artifacts = "no frame after the invalid header is applied"
error_code = "E_FRAME_LENGTH"
retry_action = "quarantine the segment"
cursor_effect = "unchanged"
isolation_scope = "frame"

[[cases]]
id = "F-007"
category = "storage_corruption"
injection_point = "frame checksum"
precondition = "payload bytes do not match the checksum"
input = "modify one payload byte"
expected_outcome = "rejected"
durable_artifacts = "invalid frame is not propagated"
error_code = "E_CHECKSUM"
retry_action = "quarantine the frame"
cursor_effect = "unchanged"
isolation_scope = "frame"

[[cases]]
id = "F-008"
category = "compatibility"
injection_point = "protocol or file format version"
precondition = "version is not supported by the binary"
input = "set an unknown version"
expected_outcome = "rejected"
durable_artifacts = "no incompatible frame is applied"
error_code = "E_FORMAT_VERSION"
retry_action = "upgrade or negotiate a compatible version"
cursor_effect = "unchanged"
isolation_scope = "connection"

[[cases]]
id = "F-009"
category = "capacity"
injection_point = "log segment boundary"
precondition = "segment reaches 64 MiB"
input = "append another valid transaction"
expected_outcome = "accepted"
durable_artifacts = "a new segment is created before append"
error_code = ""
retry_action = "continue on the new segment"
cursor_effect = "advances contiguously"
isolation_scope = "partition"

[[cases]]
id = "F-010"
category = "capacity"
injection_point = "filesystem write"
precondition = "the filesystem cannot accept the next durable write"
input = "append a transaction while disk space is exhausted"
expected_outcome = "rejected"
durable_artifacts = "the failed transaction is not committed"
error_code = "E_DISK_FULL"
retry_action = "free space and retry"
cursor_effect = "unchanged"
isolation_scope = "partition"

[[cases]]
id = "F-011"
category = "data_semantics"
injection_point = "operation deduplication"
precondition = "operation_id has already been applied"
input = "submit the same operation_id again"
expected_outcome = "duplicate"
durable_artifacts = "original result and deduplication record are retained"
error_code = "E_DUPLICATE_OPERATION"
retry_action = "return the original result"
cursor_effect = "unchanged"
isolation_scope = "operation"

[[cases]]
id = "F-012"
category = "network"
injection_point = "receive cursor"
precondition = "sequence N+1 arrives before sequence N"
input = "deliver an out-of-order event"
expected_outcome = "pending_gap"
durable_artifacts = "event is temporarily retained or explicitly rejected"
error_code = "E_SEQUENCE_GAP"
retry_action = "request the missing sequence"
cursor_effect = "unchanged"
isolation_scope = "source partition"

[[cases]]
id = "F-013"
category = "network"
injection_point = "event validation"
precondition = "one event fails checksum or schema validation"
input = "deliver a bad event among valid events"
expected_outcome = "quarantined"
durable_artifacts = "quarantine record contains event identity and error"
error_code = "E_QUARANTINED_EVENT"
retry_action = "retry only after repair or operator resolution"
cursor_effect = "other contiguous events may advance"
isolation_scope = "event"

[[cases]]
id = "F-014"
category = "process_crash"
injection_point = "after receive persistence and before ACK"
precondition = "hub has durably stored the event"
input = "hub terminates before sending Received ACK"
expected_outcome = "duplicate"
durable_artifacts = "receive log and deduplication record survive restart"
error_code = "E_DUPLICATE_OPERATION"
retry_action = "return the original receive result"
cursor_effect = "unchanged or advances contiguously"
isolation_scope = "operation"

[[cases]]
id = "F-015"
category = "process_crash"
injection_point = "after receive and before apply"
precondition = "event is durable but current state is not updated"
input = "hub terminates before Applied ACK"
expected_outcome = "accepted"
durable_artifacts = "receive state survives and event remains applicable"
error_code = ""
retry_action = "apply from the receive cursor"
cursor_effect = "receive cursor may advance; apply cursor does not"
isolation_scope = "operation"

[[cases]]
id = "F-016"
category = "restart"
injection_point = "edge and hub restart together"
precondition = "both nodes have durable local state"
input = "restart both processes and reconnect"
expected_outcome = "accepted"
durable_artifacts = "local logs, deduplication records, state, and cursors survive"
error_code = ""
retry_action = "resume from persisted cursors"
cursor_effect = "advances contiguously"
isolation_scope = "both nodes"

version = 1
tool = "cargo llvm-cov"
unit_tests_only = true
line = 100
function = 100
region = 100
# Rust stable does not currently expose cargo-llvm-cov branch instrumentation;
# enable a 100% branch threshold when the pinned toolchain supports it.
branch = "when-supported"

[[module]]
path = "crates/lattice-format/src/baseline.rs"
reason = "Validated protocol and capacity baseline"

[[module]]
path = "crates/lattice-format/src/stage_zero.rs"
reason = "Stage-0 document orchestration and vocabulary checks"

[[module]]
path = "crates/lattice-format/src/stage_zero_validation.rs"
reason = "Identifier, sequence, filesystem, and frame-layout invariants"

[[module]]
path = "crates/lattice-format/src/stage_zero_model.rs"
reason = "Deserialized stage-0 data structures; declarations have no executable branches"

[[module]]
path = "crates/lattice-core/src/lib.rs"
reason = "Storage boundary validation"

[[module]]
path = "crates/lattice-sync/src/lib.rs"
reason = "Synchronization state transitions"

[[module]]
path = "crates/lattice-transport/src/lib.rs"
reason = "Transport capacity validation"

[[excluded]]
path = "crates/lattice-format/src/lib.rs"
reason = "Module declaration and API re-exports only"

[[excluded]]
path = "crates/lattice-cli/src/lib.rs"
reason = "CLI assembly and output routing; exercised by workspace tests and smoke command"

[[excluded]]
path = "crates/lattice-cli/src/main.rs"
reason = "Process exit-code wrapper only"
